<!DOCTYPE html>
<html lang="mn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ХШҮ Adaptive тест ба Dashboard</title>
<style>
:root{--bg:#f6f7fb;--fg:#1b2336;--card:#fff;--mut:#5b6478;--ac:#2f5597;--ok:#1e8e4e;--wn:#c98a00;--bd:#c0392b;--ln:#dde2ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--fg:#e8ecf5;--card:#1b2130;--mut:#9aa5bd;--ac:#8fb0ee;--ok:#4cc38a;--wn:#e8b33d;--bd:#ef7b6e;--ln:#2c3550;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161f;--fg:#e8ecf5;--card:#1b2130;--mut:#9aa5bd;--ac:#8fb0ee;--ok:#4cc38a;--wn:#e8b33d;--bd:#ef7b6e;--ln:#2c3550;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Arial,Helvetica,sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0}h2{font-size:18px;margin:18px 0 8px}h3{font-size:15px;margin:12px 0 4px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin:12px 0}
.mut{color:var(--mut);font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:10px 12px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.o{display:block;width:100%;text-align:left;margin:6px 0}button.o:hover{border-color:var(--ac)}
button:disabled{opacity:.5;cursor:default}textarea{width:100%;min-height:90px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--ln)}
.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}.bad{border-color:var(--bd);background:color-mix(in srgb,var(--bd) 12%,var(--card))}
.bar{height:12px;border-radius:6px;background:var(--ln);overflow:hidden;margin:2px 0}.bar i{display:block;height:100%;background:var(--ac)}.bar.b2 i{background:var(--ok)}
.pg{height:6px;background:var(--ln);border-radius:3px}.pg i{display:block;height:100%;background:var(--ac);border-radius:3px}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button.on{background:var(--ac);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:left}tr.cl{cursor:pointer}tr.cl:hover{background:var(--bg)}
.sc{overflow-x:auto}.r{color:var(--bd)}.g{color:var(--ok)}.y{color:var(--wn)}
code{word-break:break-all;font-size:12px}
</style></head><body><main id="app"><p class="mut">Ачаалж байна…</p></main>
<script>
const ENDPOINT='https://script.google.com/a/macros/naog.gov.mn/s/AKfycbxi8mdNeF8bicpOk-5pJ8P7rHNR7WWfC-ur13JVEalfkTOjs69Rh95Fe-CzRfRCAU87/exec';
const D=[["D0", "Суурь ойлголт: ХШҮ-ний үндэс", "Суурь ойлголт", "13–54"], ["S1", "Алхам 1: Бэлэн байдлын үнэлгээ хийх", "А1 Бэлэн байдал", "55–72"], ["S2", "Алхам 2: Үр дагаврыг тодорхойлох", "А2 Үр дагавар", "73–82"], ["S3", "Алхам 3: Шалгуур үзүүлэлт сонгох", "А3 Шалгуур үзүүлэлт", "83–98"], ["S4", "Алхам 4: Суурь үзүүлэлт, мэдээлэл цуглуулалт", "А4 Суурь үзүүлэлт", "99–109"], ["S5", "Алхам 5: Зорилтот түвшин тогтоох", "А5 Зорилтот түвшин", "110–116"], ["S6", "Алхам 6: Үр дүнгийн хяналт-шинжилгээ", "А6 Хяналт-шинжилгээ", "117–134"], ["S7", "Алхам 7: Үнэлгээний үүрэг", "А7 Үнэлгээ", "135–151"], ["S8", "Алхам 8: Үр дүнг тайлагнах", "А8 Тайлагнах", "152–161"], ["S9", "Алхам 9: Үр дүнгийн мэдээллийг ашиглах", "А9 Ашиглах", "162–177"], ["S10", "Алхам 10: ХШҮ-ний тогтолцоог тогтворжуулах", "А10 Тогтворжуулах", "178–207"]],Q=[{"n": 1, "d": 0, "q": "Үр дүнд суурилсан ХШҮ ба уламжлалт ХШҮ хооронд ямар үндсэн ялгаа байдаг вэ?", "o": ["Төлөвлөсөн үйл ажиллагаа хэрэгжсэнээс гадна тухайлан тодорхойлсон үр дагавар (үр дүнд)-т хүрсэн эсэхийг хэмждэг", "Тайлангаар дүгнэж, хэрэгжилтийн хувийг тогтоох замаар үнэлдэг", "Санхүүгийн зарцуулалт, төсвийн сахилга батыг хянадаг", "Зөвхөн ОУ-ын болон гадаадын хандивлагчдад зориулагдсан байдаг"], "a": 0, "e": "ХШҮ нь «үр дүнд нь юу болов?» гэсэн асуултад хариулдаг; үйл ажиллагаа хийгдсэн нь үр дагавар гарсныг батлахгүй.", "p": "26, 118–119"}, {"n": 2, "d": 0, "q": "Засгийн газрын удирдлагын «Гурван хөлт тулгуур» (хүний нөөц, санхүү, хариуцлагын тогтолцоо)-нд ХШҮ нь «Дөрөв дэх хөл» болох юуг нэмдэг вэ?", "o": ["Нэмэлт хөрөнгийн эх үүсвэрийг", "Хүний нөөцөд шинэ боловсон хүчийг", "Хуулийн хяналтын шинэ байгууллагыг", "Үр дүн, үр дагаврын талаарх мэдээллийн буцах холбоог"], "a": 3, "e": "ХШҮ нь удирдлагын тогтолцоонд дутагдаж байсан үр дүн, үр дагаврын мэдээллийг өгч 4 дэх хөл болдог.", "p": "26"}, {"n": 3, "d": 0, "q": "Дараах мэдэгдлийн аль нь үр дагавар (outcome)-ыг илэрхийлж байна вэ?", "o": ["3 төрлийн 20 сургалт зохион байгуулсан", "Сургалтад хамрагдсан албан хаагчдын 70% нь шийдвэр гаргахдаа өгөгдөл баримтыг тогтмол ашигладаг болсон", "Сургалтад 600 албан хаагч хамрагдаж, сертификат авсан", "Сургалтад 40 сая төгрөг зарцуулсан"], "a": 1, "e": "Зан үйл, нөхцөл байдлын өөрчлөлт = үр дагавар. Сургалт зохион байгуулсан нь үйл ажиллагаа, хамрагдсан хүн гарц, мөнгө орц юм.", "p": "118–119"}, {"n": 4, "d": 0, "q": "Нэг аймгийн Засаг дарга жилийн тайландаа «үйл ажиллагааны төлөвлөгөө 100% биелсэн» гэж мэдээлэв. Рист, Кусек нарын хандлагаар хамгийн зөв дүгнэлт аль нь вэ?", "o": ["Бүх зорилтод хүрсэн нь батлагдсан, тоо баримтаар нотлогдсон", "Үйл ажиллагааны төлөвлөгөөг ХШҮ-д хэрэглэж болохгүй", "Тайлан хангалттай тул цаашид хяналт шаардлагагүй", "Төлөвлөгөө биелсэн нь үр дагавар бий болсныг баталгаажуулахгүй; үр дагаврын шалгуур үзүүлэлтээр нэмж шалгана"], "a": 3, "e": "Бүх үйл ажиллагааг хэрэгжүүлсэн нь хүсэн хүлээсэн зорилт, үр дагаварт хүрсэн гэсэн үг биш (ГАНТ-ийн жишээ).", "p": "118–119"}, {"n": 5, "d": 1, "q": "Бэлэн байдлын үнэлгээг яах гэж хийдэг вэ?", "o": ["ХШҮ-ний тогтолцоог байгуулахад шаардлагатай хүчин зүйл (хүсэл, манлайлал, чадавхи) байгаа эсэхийг оношлохын тулд", "Хөтөлбөрийн үр нөлөөг тооцохын тулд", "Ажилтнуудын гүйцэтгэлийг дүгнэхийн тулд", "Төсвийн аудит хийхийн тулд"], "a": 0, "e": "Бэлэн байдлын үнэлгээ нь тогтолцоог байгуулахад шаардлагатай нөхцөл байгаа эсэхийг тогтоох оношлох хэрэгсэл.", "p": "59"}, {"n": 6, "d": 1, "q": "Дараах асуултын аль нь бэлэн байдлын үнэлгээний 8 үндсэн асуултад ОРДОГГҮЙ вэ?", "o": ["ХШҮ-ний тогтолцоог хэн манлайлан дэмжиж байна вэ?", "Хөндлөнгийн үнэлгээг аль зөвлөх компани хийх вэ?", "Сөрөг мэдээлэлд байгууллага, манлайлагч хэрхэн хандах вэ?", "Тогтолцоог дэмжих чадавхи хаана байна вэ?"], "a": 1, "e": "8 асуулт шахалт, манлайлагч, түүний сэдэл, эзэн ба хэрэглэгч, нөөц хуваарилалт, сөрөг мэдээнд хандах хандлага, чадавхи, түвшин хоорондын уялдаа зэргийг хамарна.", "p": "59–65"}, {"n": 7, "d": 1, "q": "Нэгэн аймгийн ХШҮ-г сайжруулах санаачилгыг манлайлагч дэмжиж байгаа ч тэр бодлого боловсруулах төвөөс хол, шийдвэр гаргагчдад нөлөө багатай тохиолдолд ямар эрсдэл үүсэх вэ?", "o": ["Мэдээлэл цуглуулах зардал буурна", "Мэдээлэл шийдвэр гаргалтад ашиглагдахгүй, тогтолцоог хэрэгцээтэй гэж хүлээн зөвшөөрүүлэхэд хүндрэлтэй болно", "Тогтолцоо автоматаар тогтвортой болно", "Эрсдэл байхгүй, манлайлагч байхад хангалттай"], "a": 1, "e": "Нөлөө багатай манлайлагчтай тогтолцоог ач холбогдолтой, хэрэгцээтэй гэж хүлээн зөвшөөрүүлэхэд бэрхшээлтэй.", "p": "60–61"}, {"n": 8, "d": 1, "q": "Бэлэн байдлын үнэлгээгээр байгууллагын удирдлага зөвхөн «таатай сайн» гэсэн мэдээг л хүлээн зөвшөөрдөг, «таагүй, алдаа дутагдал»-ын талаарх асуудалтай мэдээ гаргасан ажилтныг шүүмжилдэг нь тогтоогдсон. Номын зөвлөмж аль нь вэ?", "o": ["Бүх хэмжээнд хурдан нэвтрүүлэх", "Сөрөг мэдээллийг тайланд оруулахгүй байх", "Тогтолцоог болгоомжтой, яаралгүй, алгуур бүрдүүлэх", "ХШҮ нэвтрүүлэхээс татгалзах"], "a": 2, "e": "Айдас хүйдэс давамгайлсан орчинд тогтолцоог болгоомжтой, алгуур бүрдүүлэх нь чухал; «мэдээ хүргэгчийг шийтгэх» эрсдэлийг тооцно.", "p": "63"}, {"n": 9, "d": 2, "q": "Шалгуур үзүүлэлт боловсруулахаас ӨМНӨ үр дагаврыг тодорхойлох ёстой нь яагаад вэ?", "o": ["Үр дагавар нь амжилт ямар байхыг тодорхойлдог бөгөөд шалгуур үзүүлэлт нь зорилттой нь харьцуулан хэмжигдэх үед л ач холбогдолтой", "Хуулиар заасан дарааллыг баримтлах ёстой учраас", "Шалгуур үзүүлэлт шаардлагагүй болдог учраас", "Үр дагавар нь нэг удаагийн тайлан болдог учраас"], "a": 0, "e": "Үр дагаврыг тодорхойлоогүй бол шалгуур үзүүлэлтийг тогтоож болохгүй; үр дагавар нь аль замаар явахыг заадаг.", "p": "74"}, {"n": 10, "d": 2, "q": "Номонд үр дагаврыг ямар хэлбэрээр томьёолохыг дэмждэг вэ?", "o": ["Эерэг, хүсэн хүлээсэн өөрчлөлт хэлбэрээр (жишээ нь «эрүүл мэнд сайжирна»)", "Асуудлыг сөрөг хэлбэрээр дахин бичих хэлбэрээр", "Хийх үйл ажиллагааны жагсаалт хэлбэрээр", "Зөвхөн тоон хэмжигдэхүүн хэлбэрээр"], "a": 0, "e": "«Өвчлөл буурна» гэхээс «эрүүл мэнд сайжирна» гэсэн эерэг томьёолол оролцогч талуудын дэмжлэгийг илүү авдаг (Зураг 2.2).", "p": "77"}, {"n": 11, "d": 2, "q": "«Хүүхдүүд сургуулиас завсардсан» хэмээх асуудлыг үр дагавар болгон зөв томьёолсон хувилбар аль нь вэ?", "o": ["Сургуулиас завсардсан хүүхдийн тоог тоолно", "Хүүхдүүдийн сургуульд хамрагдалт, суралцах байдал сайжирна", "50 сургуулийн барилгыг засварлана", "Багш нарын цалинг нэмэгдүүлнэ"], "a": 1, "e": "Эерэг, өөрчлөлтийг илэрхийлсэн томьёолол = үр дагавар. Барилга засах, цалин нэмэх нь үйл ажиллагаа/орц юм.", "p": "77"}, {"n": 12, "d": 2, "q": "Та шинэ хөтөлбөрийн үр дагаврыг боловсруулж байна. Оролцогч талуудыг хэрхэн оролцуулах нь номын зарчимд хамгийн нийцтэй вэ?", "o": ["Яамны удирдлагууд дангаараа батална", "Зөвхөн хандивлагчийн саналыг авна", "Эмзэг бүлэг, орон нутаг зэрэг дуу хоолой нь сул бүлгүүдийг оролцуулан санал асуулга, ярилцлага, фокус бүлгээр санал авна", "Гадны зөвлөх боловсруулж гүйцэтгэгчдэд хүргүүлнэ"], "a": 2, "e": "Зөвхөн чанга дуугарч буй, баян, холбоо сайтай бүлгийн бус бусад бүлгийн дуу хоолойг бүрэн сонсох хэрэгтэй.", "p": "76–77"}, {"n": 13, "d": 3, "q": "ТХБХХ («CREAM») шалгуурын аль тайлбар ЗӨВ вэ?", "o": ["Хангалттай — аль болох олон үзүүлэлт тусгах", "Холбогдолтой — ерөнхий, олон салаа утгатай байх", "Боломжийн — шалгуур үзүүлэлтийн мэдээллийг боломжийн өртгөөр цуглуулж болох", "Тодорхой — хийсвэр, хүн бүр өөрөөр ойлгох боломжтой байх"], "a": 2, "e": "Тодорхой, Холбогдолтой, Боломжийн (өртөг), Хангалттай, Хяналт-шинжилгээ хийх боломжтой гэсэн 5 шалгуур.", "p": "86"}, {"n": 14, "d": 3, "q": "ХШҮ-ний тогтолцоог бүрдүүлж эхлэх үед ямар төрлийн шалгуур үзүүлэлтийг илүүд үздэг вэ?", "o": ["Зөвхөн чанарын, хандлагын үзүүлэлтийг", "Олон хүчин зүйлийг нэгтгэсэн нарийн индексийг", "Энгийн, тоон (тоо, хувь) хэлбэрээр хэмжигдэх шалгуур үзүүлэлтийг", "Шалгуур үзүүлэлтгүйгээр тайлан бичихийг"], "a": 2, "e": "Чанарын үзүүлэлт цуглуулах, дүгнэхэд цаг их, субьектив байдаг тул эхний үед энгийн тоон үзүүлэлтийг дэмждэг.", "p": "86–87"}, {"n": 15, "d": 3, "q": "Үр дагавар: «Иргэдэд төрийн үйлчилгээ цаг хугацаанд нь үзүүлэгдэж байна». Дараах үзүүлэлтээс ТХБХХ-д хамгийн сайн нийцэх нь аль вэ?", "o": ["Төрийн үйлчилгээний сайн чанар", "Үйлчилгээний байрны тоо", "Ажилтны сургалтад зарцуулсан сая төгрөг", "Хуулиар заасан хугацаандаа үзүүлсэн үйлчилгээний эзлэх хувь"], "a": 3, "e": "Тоон, тодорхой, үр дагавартай холбогдолтой, шалгаж баталгаажуулж болохуйц. Бусад нь хийсвэр, орц эсвэл гарц юм.", "p": "86–88"}, {"n": 16, "d": 3, "q": "Нэг яам нэг бодлогод 150 шалгуур үзүүлэлт тогтоожээ. Таны зөвлөгөө аль нь вэ?", "o": ["Хэрэгцээ, цуглуулах чадавхи, зардлыг харгалзан хамгийн чухал цөөн үзүүлэлтийг сонгоно", "Мэдээлэл олон байх тусам сайн тул хэвээр үлдээнэ", "Бүгдийг нэгэн зэрэг хэмжиж эхэлнэ", "Бүх үзүүлэлтийг чанарын болгоно"], "a": 0, "e": "Шалгуур үзүүлэлт бүр өртөгтэй; Киргиз (100+), Боливи (157 → 17) нь үзүүлэлтийг цөөлөх шаардлагатайг харуулсан.", "p": "88"}, {"n": 17, "d": 4, "q": "Суурь үзүүлэлт гэж юу вэ?", "o": ["Хүрэх ёстой эцсийн түвшин", "Хөтөлбөрийн нийт төсөв", "Хөтөлбөр дуусах хугацаа", "Хяналт-шинжилгээ эхлэх үеийн нөхцөл байдлыг харуулсан, ирээдүйн гүйцэтгэлтэй харьцуулах эхлэлийн хэмжилт"], "a": 3, "e": "Суурь үзүүлэлт нь шалгуур үзүүлэлтийн анхны хэмжигдэхүүн, ирээдүйн гүйцэтгэлийг хэмжих эхлэлийн цэг.", "p": "100"}, {"n": 18, "d": 4, "q": "Хоёрдогч мэдээллийг ашиглахад юуг анхаарах ёстой вэ?", "o": ["Хоёрдогч мэдээлэл үргэлж илүү найдвартай", "Хоёрдогч мэдээллийг ХШҮ-д огт хэрэглэж болохгүй", "Өөр зорилгоор цуглуулсан тул баталгаатай, найдвартай эсэх, цуглуулах аргыг шалгаж болох эсэхийг", "Заавал хэвлэлд нийтлэгдсэн байх ёстой"], "a": 2, "e": "Хоёрдогч мэдээлэл өөр байгууллагын зорилго, асуудлын үүднээс цуглуулагддаг тул болгоомжтой хэрэглэнэ.", "p": "103"}, {"n": 19, "d": 4, "q": "Багш нарын сургалтын хөтөлбөрт шалгуур үзүүлэлт тогтоосон боловч өмнөх хэмжилт байхгүй. Юуг эхэлж хийх вэ?", "o": ["Хөтөлбөр дууссаны дараа хэмжиж эхэлнэ", "Суурь хэмжилтгүйгээр шууд зорилтот түвшин тогтооно", "Хөтөлбөр эхлэхээс өмнө (эсвэл эхний үед) шалгуур үзүүлэлтийн суурь хэмжилтийг хийнэ", "Өөр улсын үзүүлэлтийг шууд суурь болгон авна"], "a": 2, "e": "Суурь үзүүлэлтгүй бол гүйцэтгэлийн ахицыг харьцуулах цэг байхгүй болно.", "p": "100–102"}, {"n": 20, "d": 4, "q": "Нэг салбарын шалгуур үзүүлэлтийн мэдээллийг ямар аргаар цуглуулахаа шийдэж байна. Аль нь номын хандлагад хамгийн нийцтэй вэ?", "o": ["Бүх тохиолдолд өрхийн санал асуулга хамгийн сайн", "Ямагт хамгийн хямд аргыг сонгоно", "Зөвхөн албан ёсны статистикт найдна", "Нөөц, цаг хугацаа, хэрэглэгчийн хэрэгцээг харгалзан аргуудыг хослуулна (захиргааны бүртгэл, ярилцлага, асуулга г.м)"], "a": 3, "e": "Хамгийн оновчтой арга гэж нэг зөв хариулт байхгүй; арга хоёрыг хослуулах нь шалгуур үзүүлэлт бүрийн мэдээллийг хянах боломж олгодог.", "p": "104"}, {"n": 21, "d": 5, "q": "Зорилтот түвшинг хэрхэн тогтоодог вэ?", "o": ["Суурь үзүүлэлтийн түвшин + хүсэн хүлээж буй сайжруулалт = зорилтот түвшин", "Суурь үзүүлэлт × хугацаа", "Өмнөх жилийн гүйцэтгэл − нөөц", "Зорилт ÷ шалгуур үзүүлэлт"], "a": 0, "e": "Зорилтот түвшинг суурь үзүүлэлтээс эхлэн, хүсэн хүлээж буй сайжруулалтыг нэмж тогтооно (Зураг 5.2).", "p": "111"}, {"n": 22, "d": 5, "q": "Зорилтот түвшинг 3–4 жилээс урт хугацаагаар тогтоохыг яагаад зөвлөдөггүй вэ?", "o": ["Нөөц болон орцтой холбоотой эрсдэл хэт их болдог тул", "Хууль зөвшөөрдөггүй тул", "Мэдээлэл цуглуулах боломжгүй тул", "Сонгуулийн мөчлөгтэй давхцдаг тул"], "a": 0, "e": "Зорилтот түвшинг бодит байдалд нийцүүлэх хэрэгтэй; 3–4 жилээс дээш хугацаанд нөөцийн эрсдэл өснө.", "p": "112"}, {"n": 23, "d": 5, "q": "Хөдөөгийн 3–5 насны хүүхдийн сургуулийн өмнөх боловсролд хамрагдалтын суурь үзүүлэлт 30% байв. Нөөцийн хүрээнд 3 жилд 12 хувийн нэгжээр сайжруулахаар төлөвлөвөл зорилтот түвшин хэд вэ?", "o": ["12%", "42%", "30%", "360%"], "a": 1, "e": "Зорилтот түвшин = суурь (30) + хүсэн хүлээсэн сайжруулалт (12) = 42%.", "p": "110–111"}, {"n": 24, "d": 5, "q": "Дарга «бүх иргэд 2 жилийн дотор төрийн үйлчилгээг 100% цахимаар авна» гэсэн зорилтот түвшин тогтоохыг хүсэв. Таны зөвлөгөө аль нь вэ?", "o": ["Өндөр зорилт үргэлж сайн тул дэмжинэ", "Зорилтыг үгүйсгэж зөвхөн үйл ажиллагаа тоолно", "Зорилтот түвшинг жил бүр доош засна", "Суурь түвшин, нөөц, чадавхи, өмнөх чиг хандлагыг тооцож, хүрч болохуйц зорилтот түвшин тогтооно"], "a": 3, "e": "Зорилтот түвшин нь нөөцийн асуудал, байгууллагын чадавхийг харгалзсан, хүрч болохуйц байх ёстой.", "p": "111–112"}, {"n": 25, "d": 6, "q": "Хэрэгжилтийн хяналт-шинжилгээ юуг хянадаг вэ?", "o": ["Үр дагаварт хүрэхэд хэрэглэсэн арга, стратегийг — орц, үйл ажиллагаа, гарцыг", "Зөвхөн үр нөлөөг", "Зөвхөн иргэдийн сэтгэл ханамжийг", "Үнэлгээний зөвлөмжийн хэрэгжилтийг"], "a": 0, "e": "Хэрэгжилтийн ХШ нь орц, үйл ажиллагаа, гарцыг; үр дүнгийн ХШ нь үр дагавар, зорилтот түвшинг хянадаг.", "p": "119"}, {"n": 26, "d": 6, "q": "Үр дүнгийн мэдээлэл байгууллага дотор ямар чиглэлд урсах ёстой вэ?", "o": ["Зөвхөн дээш чиглэлд", "Хэвтээ болон босоо аль алинд", "Зөвхөн доош чиглэлд", "Зөвхөн гадаад хандивлагч руу"], "a": 1, "e": "Хэвтээ (байгууллага хоорондын) ба босоо (түвшин хоорондын) урсгал хоёулаа хэрэгтэй, ихэнхдээ хэвтээ нь хэцүү.", "p": "124–125"}, {"n": 27, "d": 6, "q": "ГАНТ бүдүүвчийн дагуу бүх ажил 100% биелсэн боловч хүссэн үр дагаварт хүрсэн эсэх нь тодорхойгүй байна. Зөв дүгнэлт аль нь вэ?", "o": ["ГАНТ нь ХШҮ-д хангалттай", "ГАНТ хэрэггүй тул устгана", "ГАНТ нь үйл ажиллагаа, гарцыг хянадаг; үр дагаврыг үр дагаврын шалгуур үзүүлэлтээр нэмж хянах шаардлагатай", "Үр дагаварт хяналт хийх шаардлагагүй"], "a": 2, "e": "ГАНТ нь удирдлагын арга хэрэгсэл боловч хүсэн хүлээсэн үр дагавар бодитоор бий болж байгааг харуулдаггүй.", "p": "118"}, {"n": 28, "d": 6, "q": "Таны нэгжид гүйцэтгэлийн мэдээлэл цуглуулдаг ч хэн хариуцахаа, хэнд зориулахаа хэн ч мэдэхгүй байна. Эхэлж юуг тодорхойлох вэ?", "o": ["Шинэ программ хангамж худалдан авна", "Мэдээлэл цуглуулахаа зогсооно", "Хэн, хэзээ, хэрхэн цуглуулах, хэн тайлагнах, хэнд зориулах гэсэн хариуцлагыг түвшин бүрээр тодорхойлно", "Бүх мэдээллийг дээд удирдлагад шууд хүргэнэ"], "a": 2, "e": "Түвшин тус бүрийн хариуцлагыг (эх сурвалж, давтамж, аргачлал, цуглуулагч, тайлагнагч, хэрэглэгч) тодорхой болгоно.", "p": "124"}, {"n": 29, "d": 7, "q": "Хяналт-шинжилгээ ба үнэлгээний харилцан хамаарлын талаар ном юу гэж үздэг вэ?", "o": ["Үнэлгээ нь хяналт-шинжилгээг орлодог", "Хоёулаа яг ижил асуулт тавьдаг", "Харилцан бие биенээ нөхдөг: ижил мэдээлэлд өөр асуулт тавьж, өөр дүн шинжилгээ хийдэг", "Үнэлгээ нь зөвхөн төсөл дууссаны дараа хийгддэг тул ХШ-тэй хамааралгүй"], "a": 2, "e": "ХШ ба үнэлгээ нь үр дүнд суурилсан ХШҮ-ний 2 бүрэлдэхүүн; аль нэг нь ганцаараа хангалтгүй.", "p": "136"}, {"n": 30, "d": 7, "q": "«Төлөвлөсөн ажлуудаас юу хэрэгжиж, юу хэрэгжсэнгүй вэ? Зардал, хугацаа, ажилтнуудын чадавхийг төлөвлөгөөнд хэр оновчтой тусгасан бэ?» гэсэн асуултад голчлон хариулдаг үнэлгээ аль нь вэ?", "o": ["Хэрэгжилтийн өмнөх үнэлгээ", "Үр нөлөөний үнэлгээ", "Мета-үнэлгээ", "Үйл явцын хэрэгжилтийн үнэлгээ"], "a": 3, "e": "Үйл явцын хэрэгжилтийн үнэлгээ нь хэрэгжилтийн дэлгэрэнгүй асуудалд голчлон анхаардаг.", "p": "145"}, {"n": 31, "d": 7, "q": "Хөтөлбөрийн үйл ажиллагааг төлөвлөсний дагуу маш сайн хэрэгжүүлсэн ч үр дагаврын шалгуур үзүүлэлт сайжираагүй байна. Үнэлгээ юунд голлон чиглэх ёстой вэ?", "o": ["Ажилтнуудын ажлын хэрэгжилтэд", "Хөтөлбөрийг шууд зогсооход", "Зорилтот түвшинг дахин нэмэгдүүлэхэд", "Шалтгаан-үр дагаврын загвар (төлөвлөлтийн логик) зөв эсэх, асуудлыг зөв ойлгосон эсэхэд"], "a": 3, "e": "Загвар сул, хэрэгжилт хүчтэй (Зураг 7.3-ын 2-р дөрвөлжин) үед үнэлгээний асуулт төлөвлөлтийн логикт чиглэнэ.", "p": "141–142"}, {"n": 32, "d": 7, "q": "Сайд 3 долоо хоногийн дотор нэг хөтөлбөрийн явцад засч залруулах шаардлагатай эсэх талаар шийдвэр гаргах хэрэгтэй. Аль үнэлгээ хамгийн тохиромжтой вэ?", "o": ["Олон жилийн үр нөлөөний үнэлгээ", "Шуурхай үнэлгээ — гол мэдээлэгчтэй ярилцлага, фокус бүлэг, ажиглалт, асуулгаар түргэн дүгнэлт гаргана", "Дараа жилийн тайланг хүлээнэ", "Мета-үнэлгээ"], "a": 1, "e": "Шуурхай үнэлгээ нь бодит цаг хугацаанд түргэн үнэлж, шийдвэр гаргагчдыг шинэчилсэн мэдээллээр хангадаг.", "p": "146"}, {"n": 33, "d": 8, "q": "Үр дүнгийн мэдээлэлд дүн шинжилгээ хийж тайлагнах үе шат юуг шийддэг вэ?", "o": ["Юуг, хэзээ, хэнд тайлагнахыг", "Хэний цалинг нэмэхийг", "Хөтөлбөрийн төсвийн хэмжээг", "Аль салбарт ХШҮ байгуулахыг"], "a": 0, "e": "Тайлагнах нь юуг, хэзээ, хэнд тайлагнахыг шийддэг чухал үе шат.", "p": "152"}, {"n": 34, "d": 8, "q": "Тоо мэдээллийн «илүүдэл»-ийн талаар ном юу гэж үздэг вэ?", "o": ["Бүтээмж муутай; шийдвэр гаргагч бүрт хэрэгтэй мэдээллийг тохирсон хэлбэрээр өгөх ёстой", "Мэдээлэл их байх тусам шийдвэр сайн болдог", "Тайлан зөвхөн нарийн хүснэгт байх ёстой", "Тайланг зөвхөн жилд нэг удаа гаргана"], "a": 0, "e": "Шийдвэр гаргагчид ямар мэдээлэл хэрэгтэйг мэдэж, шаардлагатай мэдээллийг тохиромжтой хэлбэрээр өгөх хэрэгтэй.", "p": "155"}, {"n": 35, "d": 8, "q": "Үнэлгээний тайланд «хөтөлбөрийг сайжруул» гэж ерөнхий зөвлөмж бичжээ. Үүнийг хэрхэн сайжруулах вэ?", "o": ["Зөвлөмжийг ерөнхий хэвээр үлдээнэ", "Зөвлөмж бүрт хувилбар, ойролцоо зардал, хүлээгдэх үр дагаврыг тусган, товч хэлбэрээр өгнө", "200 хуудас дэлгэрэнгүй тайлан хавсаргана", "Зөвхөн сайн мэдээг тайлагнана"], "a": 1, "e": "Албан тушаалтнууд арга хэмжээний үр нөлөө, зардлын талаар бүрэн ойлголт авахыг хүсдэг.", "p": "155"}, {"n": 36, "d": 8, "q": "Гүйцэтгэлийн мэдээллийг шийдвэр гаргагчид ойлгомжтой танилцуулахдаа аль хандлагыг баримтлах вэ?", "o": ["Бүх үзүүлэлтийг нарийн хүснэгтээр оруулна", "Зөвхөн сайн үзүүлэлтийг сонгоно", "Бодит үр дагаврыг суурь үзүүлэлт, зорилтот түвшинтэй харьцуулж, гол тоог энгийн хүснэгт, график, ойлгомжтой хэлээр харуулна", "Техникийн нэр томьёо, товчилсон үгээр бичнэ"], "a": 2, "e": "Өмнөх хугацаа, суурь үзүүлэлт, зорилттой харьцуулах; хамгийн чухал гол тоог энгийн, тодорхой танилцуулах.", "p": "156–157"}, {"n": 37, "d": 9, "q": "Үр дүнгийн мэдээллийн 10 үндсэн хэрэглээнд аль нь ОРДОГГҮЙ вэ?", "o": ["Төсвийн санал боловсруулахад дэмжлэг үзүүлэх", "Нөөц хуваарилах шийдвэр гаргахад дэмжлэг үзүүлэх", "Олон нийтийн итгэлийг олж авахын тулд харилцах", "Таагүй мэдээ гаргасан ажилтныг шийтгэх үндэслэл болгох"], "a": 3, "e": "Шигтгээ 9.1-ийн 10 хэрэглээнд шийтгэх бус хариуцлага, төсөв, нөөц, засч залруулалт, сайжруулалт, итгэл орно.", "p": "163, 180"}, {"n": 38, "d": 9, "q": "Үр дүнд суурилсан ХШҮ-ний гол санаа юу вэ?", "o": ["Үр дүнгийн мэдээллийг холбогдох хэрэглэгчдэд цаг хугацаанд нь хүргэж, эргэх мэдээллээр удирдлагыг сайжруулах", "Мэдээллийг зөвхөн архивлах", "Мэдээллийг зөвхөн олон улсын байгууллагад илгээх", "Мэдээллийг жилд нэг удаа нэгтгэх"], "a": 0, "e": "Мэдээллийг тогтмол боловсруулахад бус, цаг хугацаанд нь хэрэглэгчдэд хүргэж, шийдвэр гаргахад ашиглахад гол санаа оршино.", "p": "162"}, {"n": 39, "d": 9, "q": "Хоёр хөтөлбөрийн гүйцэтгэл эрс ялгаатай гарав. Мэдээллийг хэрхэн ашиглах нь зөв вэ?", "o": ["Муу гүйцэтгэлтэй хөтөлбөрийн төсвийг автоматаар бүрэн хасна", "Зөрүүний шалтгааныг (үнэлгээгээр) судалж, төсвийн санал, нөөцийн хуваарилалт, засч залруулах арга хэмжээнд ашиглана", "Мэдээллийг үл тоомсорлоно", "Хоёуланг нь тэнцүү санхүүжүүлнэ"], "a": 1, "e": "Гүйцэтгэлийн мэдээлэл төсөв, нөөц хуваарилалт, засч залруулалтын шийдвэрт дэмжлэг болдог; шалтгааныг нь судлах нь чухал.", "p": "163"}, {"n": 40, "d": 9, "q": "Агентлаг гүйцэтгэгчтэй гэрээ байгуулж байна. ХШҮ-ний мэдээллийг хэрхэн ашиглах вэ?", "o": ["Гэрээнд зөвхөн хийх үйл ажиллагааны жагсаалт тусгана", "Гэрээнд үр дагаварт суурилсан гүйцэтгэлийн зорилтот түвшинг тусгаж, гүйцэтгэлийг тэдгээртэй харьцуулан хянана", "Гүйцэтгэлийг огт хянахгүй", "Гэрээний төгсгөлд нэг удаа үнэлнэ"], "a": 1, "e": "Гэрээнд үр дагаварт суурилсан зорилтот түвшин тусгаж, шагнал, урамшуулал эсвэл арга хэмжээтэй холбож болно.", "p": "164"}, {"n": 41, "d": 10, "q": "Дараахаас аль нь ХШҮ-ний тогтолцоог тогтворжуулах 6 бүрэлдэхүүн хэсэгт ОРДОГГҮЙ вэ?", "o": ["Хэрэгцээ шаардлага", "Тодорхой үүрэг, хариуцлага", "Гадаадын хандивлагчийн байнгын санхүүжилт", "Хөшүүрэг"], "a": 2, "e": "6 бүрэлдэхүүн: хэрэгцээ шаардлага, үүрэг хариуцлага, итгэж болохуйц мэдээлэл, хариуцлагын тогтолцоо, чадавхи, хөшүүрэг.", "p": "178–181"}, {"n": 42, "d": 10, "q": "Номын дагуу ХШҮ-ний тогтвортой байдлын урьдчилсан нөхцөл юу вэ?", "o": ["Их хэмжээний мэдээллийн сан", "Мэдээллийн хэрэглээ — хэрэглээ байхгүй бол тогтолцоо тогтвортой байдаггүй", "Хамгийн орчин үеийн программ хангамж", "Гадаад зөвлөхүүдийн байнгын оролцоо"], "a": 1, "e": "ХШҮ-ний тогтвортой байдал, хэрэглээ харилцан холбоотой; хэрэглээний асуудлыг эхэлж авч үзнэ.", "p": "179"}, {"n": 43, "d": 10, "q": "Орон нутгийн түвшинд мэдээлэл зөвхөн «дамжуулагдах» үүрэгтэй, тэнд ашиглах хэрэгцээ, хариуцах эзэн байхгүй байна. Дүгнэлт аль нь вэ?", "o": ["Хэвийн; зөвхөн дээд түвшин ашиглахад хангалттай", "Орон нутгийг ХШҮ-ээс хасна", "Мэдээллийн технологи нэмэхэд л хангалттай", "Энэ нь тогтолцоог хэврэг болгоно; бүх түвшинд мэдээллийн хэрэгцээ, хариуцах эзэн байх ёстой"], "a": 3, "e": "Зөвхөн «мэдээлэл дамжуулах» түвшин байх ёсгүй; эзэнгүй бол сонирхол буурч, мэдээллийн чанар муудна.", "p": "180"}, {"n": 44, "d": 10, "q": "Хэлтсийн дарга гүйцэтгэл муу гэсэн мэдээ гаргасан ажилтанд сануулга өгөв. Удирдлагад ямар зөвлөгөө өгөх вэ?", "o": ["Хариуцлага тооцсон нь зөв", "Мэдээллийг хаалттай болгоно", "ХШҮ-г хэлтсээс гаргана", "Муу мэдээ гаргасан хүмүүсийг шийтгэх нь тогтолцоог нураах хамгийн хурдан арга; үнэнч, цаг үеэ олсон мэдээллийг урамшуулна"], "a": 3, "e": "Мэдээ гаргагчид улс төрийн шийтгэлээс хамгаалагдсан байх ёстой; хөшүүрэг нь амжилтыг хүлээн зөвшөөрөх, шийтгэхгүй байх.", "p": "180–181"}],ADV={"D0": ["Үр дүнд суурилсан ХШҮ-ний үндсэн ойлголтыг (орц–үйл ажиллагаа–гарц–үр дагавар–үр нөлөө, ХШ ба үнэлгээний ялгаа) Оршил хэсгээс (х.13–54) дахин уншиж, Дасгал E0-г хийнэ. Өөрийн байгууллагын тайлангаас 5 «амжилт»-ыг түвшнээр нь ангилж үз.", "Үндсэн ойлголт байгаа ч «гарц» ба «үр дагавар»-ыг заримдаа андуурч байна. Өөрийн ажлын жишээн дээр «Тэгээд үр дүнд нь юу болов?» гэж давтан асууж дадлагажаарай.", "Суурь ойлголт сайн. Бусад сонсогчдод үр дүнгийн гинжин хэлхээг жишээгээр тайлбарлаж, хань болох (peer mentor) боломжтой.", "Нэгдүгээр цагт «үйл ажиллагаа ба үр дагавар» ялгах богино дасгал (өөрсдийн тайлангийн өгүүлбэрийг ангилах) хийж, 3 хөлт тулгуур + 4 дэх хөлийг зургаар тайлбарла."], "S1": ["Бэлэн байдлын үнэлгээний 8 асуултыг (х.59–64) өөрийн байгууллагын жишээгээр хариул: хэн манлайлагч, хэн эзэн, сөрөг мэдээнд хэрхэн хандах вэ. Дасгал E1-г хий.", "Үндсэн асуултуудыг мэдэж байна, гэхдээ саад бэрхшээлийг (бүтцийн, соёлын, улс төрийн, хувь хүний) ялгахад дутагдалтай. Манлайлагчийн үүрэг, орчин нөхцөлд анхаар (х.60–64).", "Бэлэн байдлын үнэлгээг сайн ойлгосон. Өөрийн байгууллагын эхний 90 хоногийн төлөвлөгөөг боловсруулахад ахиж болно.", "Бэлэн байдлын 8 асуултыг бүлгээр өөрсдийн яам, агентлагт хэрэглэн «гэрлэн дохио» (улаан/шар/ногоон) үнэлгээ хийлгэж, сөрөг мэдээнд хандах хандлагыг хэлэлцүүл."], "S2": ["Алхам 2-ыг (х.73–82) дахин унш. Асуудлыг эерэг, хүсэн хүлээсэн үр дагавар болгон томьёолох (Зураг 2.2), үр дагавар ба гарцыг ялгах Дасгал E2-г хий.", "Үр дагаврыг томьёолоход ахиц байна, гэхдээ үйл ажиллагаа/гарцыг үр дагавар гэж бичих хандлагатай. Томьёолол бүрийг «Үүний үр дүнд юу өөрчлөгдөх вэ?» гэж шалга; оролцогч талуудын зураглал нэм.", "Үр дагаврыг тодорхойлох чадвар сайн. Бусдын томьёоллыг засах (peer review) үүрэг өг.", "Сонсогчдын өөрсдийн «асуудал»-ыг самбарт цуглуулж, бүлгээр эерэг үр дагавар болгон дахин томьёолуулах «Хаанаас – Хаашаа» дасгал хий (Зураг 2.2)."], "S3": ["ТХБХХ («CREAM») 5 шалгуур, тоон ба чанарын үзүүлэлтийн ялгаа, үзүүлэлт хэт олон байх эрсдэлийг (х.83–98) дахин унш. Дасгал E3-д 3 үзүүлэлтийг ТХБХХ-аар оноож үз.", "ТХБХХ-ийг мэдэж байна, хэрэглээнд «боломжийн (зардал)», «хангалттай» шалгуурыг орхигдуулах хандлага бий. Үзүүлэлт бүрт мэдээллийн эх сурвалж, цуглуулах зардлыг тодорхойл.", "Шалгуур үзүүлэлт сонгох чадвар сайн. Цөөн, чанартай үзүүлэлтийн багц боловсруулахад бусдад дэмжлэг үзүүл.", "Нэг бодлогод ирсэн 10 «сул» үзүүлэлтийг сонсогчдоор ТХБХХ-аар шүүлгэж 5 болгон цөөлүүл (Киргиз, Боливийн жишээ, х.88)."], "S4": ["Суурь үзүүлэлт гэж юу болох, яагаад зайлшгүй хэрэгтэйг (х.99–109) дахин унш. Мэдээлэл цуглуулах аргын сонголт (Зураг 4.3), анхдагч/хоёрдогч мэдээллийн давуу сул талыг ялгаж Дасгал E4-г хий.", "Суурь үзүүлэлтийн санааг ойлгосон. Мэдээллийн эх сурвалж, давтамж, хариуцагч, чанар (найдвартай, баталгаатай, цаг үеэ олсон)-ыг нэг матрицад тодорхой бич.", "Суурь үзүүлэлт, мэдээлэл цуглуулалтын төлөвлөлт сайн. Өөрийн байгууллагын жинхэнэ суурь утгыг цуглуулах даалгавар өг.", "Нэг үзүүлэлтийн суурь утгыг сонсогчдын байгууллагын захиргааны бүртгэлээс бодитоор олж үзэх «мэдээлэл агнуур» (data hunt) дасгал зохион байгуул."], "S5": ["Зорилтот түвшин = суурь үзүүлэлт + хүсэн хүлээж буй сайжруулалт гэдгийг (Зураг 5.2, х.110–116) дахин унш. Нөөц, чадавхи, 3–4 жилийн хугацааг харгалзан Дасгал E5-г хий.", "Томьёог мэдэж байна, гэвч зорилтыг хэт өндөр эсвэл хэт намхан тавих хандлагатай. Өмнөх чиг хандлага, нөөцийн хүрэлцээ, улс төрийн амлалтыг харгалз.", "Бодит, хүрч болохуйц зорилтот түвшин тогтоох чадвар сайн.", "«Бүгд цахимаар болно (100%)» шиг хэт амбицтай зорилтыг сонсогчдоор бодитоор шүүлгэж, суурь + нөөц + хугацаагаар дахин тооцуул."], "S6": ["Хэрэгжилтийн ХШ ба Үр дүнгийн ХШ-ний ялгаа, мэдээллийн хэвтээ/босоо урсгал, хариуцлагын тодорхойлолтыг (х.117–134) дахин унш. Дасгал E6-г хий.", "Хоёр төрлийн ХШ-ийн ялгааг мэдэж байна, гэхдээ тэдгээрийг үр дагавар → зорилтот түвшин → стратегиар холбож (Зураг 6.5–6.6) харуулахад дадлага хэрэгтэй.", "Үр дүнгийн хяналт-шинжилгээний логикийг сайн ойлгосон.", "ГАНТ бүдүүвч 100% биелсэн мөртлөө үр дагавар гараагүй «жишээ кейс»-ийг бүлгээр задлан шинжлүүл."], "S7": ["Үнэлгээ ба хяналт-шинжилгээний харилцан нөхөх үүрэг, үнэлгээний төрлүүд (х.135–151), Зураг 7.3-ын дөрвөлжин загварыг дахин унш. Дасгал E7-г хий.", "Үнэлгээний төрлүүдийг мэдэж байна, гэвч нөхцөл байдалд тохирох төрлийг сонгох (хэрэгжилт эсвэл загварын асуудал) дээр дадлага хэрэгтэй.", "Үнэлгээний үүргийг сайн ойлгосон.", "Зураг 7.3-ын дөрвөлжин дээр 4 жижиг кейс байрлуулж, тус бүрт ямар үнэлгээний асуулт, ямар төрөл тохирохыг бүлгээр хэлэлцүүл."], "S8": ["Алхам 8 (х.152–161): юуг, хэзээ, хэнд тайлагнах; суурь ба зорилттой харьцуулах; товч, ойлгомжтой хэлбэр. Дасгал E8-аар 1 хуудас «Үр дүнгийн товч» бэлтгэ.", "Тайлан бичих чадвартай, гэхдээ хэрэглэгч бүрт зориулсан хэлбэр, сөрөг мэдээг ил тод хүргэх талд дадлага хэрэгтэй.", "Тайлагнах чадвар сайн. Бусдын «Үр дүнгийн товч»-д санал өгөх үүрэг өг.", "Нэг ижил тоо мэдээг 3 өөр хэрэглэгчид (сайд, олон нийт, санхүү) зориулж 5 минутанд бичүүлэх «аудиторийн тохируулга» дасгал хий."], "S9": ["Алхам 9 (х.162–177): үр дүнгийн мэдээллийн 10 хэрэглээ (Шигтгээ 9.1) ба эргэх мэдээллийн мөчлөгийг дахин унш. Дасгал E9-г хий.", "Хэрэглээний жишээг мэдэж байна. Мэдээллийг төсөв, нөөц хуваарилалт, гэрээний шийдвэртэй тодорхой холбох дадлага хийнэ.", "Мэдээллийг шийдвэрт ашиглах ойлголт сайн.", "Шигтгээ 9.1-ийн 10 хэрэглээнээс сонсогчдын байгууллагад хамгийн бага ашиглагддаг 3-ыг сонгон «яагаад» гэдгийг хэлэлцүүл."], "S10": ["Алхам 10 (х.178–207): тогтворжуулах 6 бүрэлдэхүүн (хэрэгцээ, үүрэг хариуцлага, найдвартай мэдээлэл, хариуцлагын тогтолцоо, чадавхи, хөшүүрэг) ба саад бэрхшээлийг дахин унш. Дасгал E10-г хий.", "6 бүрэлдэхүүнийг мэднэ; «хэрэглээгүй бол тогтвортой байдаггүй» зарчмыг өөрийн байгууллагад хэрхэн хэрэгжүүлэхээ тодорхой болго.", "Тогтворжуулалтын зарчмыг сайн ойлгосон.", "Сонсогч бүр өөрийн байгууллагыг 6 бүрэлдэхүүнээр 1–5 оноогоор үнэлж, нэгдсэн «аалзны тор» зургийг самбарт гаргаж ярилц."]},EX={"D0": ["E0: Үр дүнгийн гинжин хэлхээ: «Завгүй байх ≠ үр дүнтэй»", "Өөрийн байгууллагын нэг хөтөлбөр эсвэл бодлогыг сонгож нэг өгүүлбэрээр тодорхойл. (Байхгүй бол: «Иргэдэд төрийн үйлчилгээг цахимаар хүргэх хөтөлбөр»-ийг ав.)"], "S1": ["E1: Бэлэн байдлын үнэлгээ: миний байгууллага бэлэн үү?", "8 асуулт бүрт нотолгоотой (баримт, жишээ) хариулж, 1–5 оноогоор үнэл."], "S2": ["E2: Асуудлаас үр дагавар руу: «Хаанаас – Хаашаа»", "Өөрийн салбарын 3 бодит асуудлыг бич."], "S3": ["E3: Шалгуур үзүүлэлтийг ТХБХХ-аар шүүх", "E2-ын үр дагавар бүрт 2–3 шалгуур үзүүлэлт санал болго (тоон/хувиар)."], "S4": ["E4: Суурь үзүүлэлт ба мэдээлэл цуглуулах матриц", "E3-ын эцсийн үзүүлэлт бүрийн суурь утгыг олж бич (эсвэл олох төлөвлөгөө гарга)."], "S5": ["E5: Бодит зорилтот түвшин тогтоох", "Үзүүлэлт бүрт 3 жилийн хүрээнд жилээр зорилтот түвшин тогтоо (Зураг 5.2)."], "S6": ["E6: Хэрэгжилтийн ХШ-ийг үр дүнгийн ХШ-тэй холбох", "Нэг үр дагаварт Зураг 6.6 шиг «Зорилго → Үр дагавар → Зорилтот түвшин → Стратеги» схем зур."], "S7": ["E7: Үнэлгээ хэзээ, ямар төрлөөр хийх вэ?", "Хөтөлбөрийн зорилтоос хоцорсон 1 үзүүлэлтийг (бодит эсвэл таамаглалын) сонго."], "S8": ["E8: 1 хуудас «Үр дүнгийн товч»", "Хүснэгт 8.1-ийн хэлбэрээр 3–4 үзүүлэлтийн суурь, одоогийн, зорилтот түвшин, өөрчлөлтийг (бодит эсвэл жишээ тоогоор) гарга."], "S9": ["E9: Мэдээллийг шийдвэр болгох", "Шигтгээ 9.1-ийн 10 хэрэглээнээс таны байгууллагад хамгийн бага ашиглагддаг 3-ыг сонго."], "S10": ["E10: Тогтворжуулах 12 сарын төлөвлөгөө ба эцсийн нэгтгэл", "6 бүрэлдэхүүн (хэрэгцээ, үүрэг хариуцлага, найдвартай мэдээлэл, хариуцлагын тогтолцоо, чадавхи, хөшүүрэг)-ийг 1–5 оноогоор үнэл."]};
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function start(code,type,name){S={code,type,name,d:0,pos:0,cr:D.map(()=>[-1,-1,-1,-1]),rf:D.map(()=>''),cl:D.map(()=>0),nt:D.map(()=>''),rec:{},phase:'q',cur:null,ended:false};item();}
function item(){S.cur={n:cq().n,st:0,ord:shuf([0,1,2,3]),first:-2,conf:0,c:null};S.phase='q';sv();draw();}
function ans(i){const q=cq(),c=S.cur;if(c.first===-2)c.first=i;
 if(i===q.a)return fin(CR[c.st]);
 if(c.st>=2)return fin(0);
 up();}
function up(){const q=cq(),c=S.cur;if(c.first===-2)c.first=-1;c.st++;
 if(c.st===1){const w=shuf([0,1,2,3].filter(x=>x!==q.a))[0];c.pair=shuf([q.a,w]);}
 if(c.st===2){c.stm=Math.random()<.5?q.a:shuf([0,1,2,3].filter(x=>x!==q.a))[0];}
 c.msg=1;sv();draw();}

 if(c>=.5){if(i===0){if(c===1){cr[1]=1;n=2}else n=1}else if(i===1)n=2;else if(i===2)n=3}
 else if(i===0)n=1;
 if(n<0){S.phase='dom';sv();return draw();}
 S.pos=n;item();}

 return b+'</div>';}
